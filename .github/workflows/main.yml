name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          mkdir -p /tmp/keep && cp -r lib assets pubspec.yaml /tmp/keep/
          flutter create . --org com.technews --project-name tech_news --platforms=android
          rm -rf lib assets pubspec.yaml
          cp -r /tmp/keep/lib /tmp/keep/assets /tmp/keep/pubspec.yaml .

      - name: Patch Android
        run: |
          python3 - <<'PY'
          import re, os
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'POST_NOTIFICATIONS' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
                         s, count=1)
          s = s.replace('android:label="tech_news"', 'android:label="أخبار التقنية"')
          open(m, 'w', encoding='utf-8').write(s)

          kts, groovy = 'android/app/build.gradle.kts', 'android/app/build.gradle'
          if os.path.exists(kts):
              g = open(kts).read()
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              open(kts, 'w').write(g)
          else:
              g = open(groovy).read()
              g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              open(groovy, 'w').write(g)
          PY

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: tech-news-apk
          path: build/app/outputs/flutter-apk/*.apk
