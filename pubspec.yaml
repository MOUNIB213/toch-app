name: tech_news
description: أخبار التقنية - Tech News
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  xml: ^6.5.0
  html: ^0.15.4
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.2.0
  translator: ^1.0.0
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
